apply plugin: 'com.android.library'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle" // <- imprescindible

android {
    namespace "com.davidmartos96.sqflite_sqlcipher"
    compileSdkVersion 34          // o el que uses

    defaultConfig {
        minSdkVersion 19
        consumerProguardFiles 'consumer-rules.pro'
    }
    lint { disable 'InvalidPackage' }
}

/* El script anterior ya declara compileOnly las libs de Flutter,
   así que aquí solo añades lo que sea tuyo (por ejemplo junit) */
dependencies {
    testImplementation "junit:junit:4.13.2"
}